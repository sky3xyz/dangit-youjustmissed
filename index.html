<!DOCTYPE html>

<head>
  <title>
    Just Missed
  </title>

  <script>
    let source = null;

    function load(){
      const start_in = document.getElementById("start");
      const end_in = document.getElementById("end");
      const status = document.getElementById("status");
      const dep_list = document.getElementById("departures");
      const route_list = document.getElementById("routes");

      if (source) { source.close(); }
      dep_list.innerHTML = "";
      route_list.innerHTML = "";
      status.textContent = "connecting...";

      const url = new URL("/api/trip", window.location.origin);
      const params = {
        from : start_in.value,
        to   : end_in.value
      };
      url.search = new URLSearchParams(params).toString();

      source = new EventSource(url.toString());

      source.addEventListener("open", () => {
        status.textContent = "listening — we'll shout when you miss one";
      });

      source.addEventListener("error", (e) => {
        let data = null;
        try { data = JSON.parse(e.data); } catch (err) { /* connection-level */ }
        if (data && (data.error || data.unresolved)) {
          status.textContent = "error: " + (data.error || data.unresolved);
          status.className = "error";
        } else {
          status.textContent = "connection lost";
        }
      });

      source.addEventListener("legs", (e) => {
        const legs = JSON.parse(e.data);
        route_list.innerHTML = "";
        const header = document.createElement("li");
        header.textContent = "--- next trip legs ---";
        route_list.appendChild(header);
        if (legs.length === 0) {
          const li = document.createElement("li");
          li.textContent = "(no transit legs found)";
          route_list.appendChild(li);
        }
        for (const leg of legs) {
          const li = document.createElement("li");
          if (leg.mode === "TRANSIT") {
            li.textContent = `[${leg.line || "?"}] ${leg.from} -> ${leg.to}`;
            if (leg.headsign && leg.headsign !== leg.to) {
              li.textContent += ` (${leg.headsign})`;
            }
          } else {
            li.textContent = `[WALK] ${leg.distance_m || "?"}m — ${leg.instruction || ""}`;
          }
          route_list.appendChild(li);
        }
      });

      source.addEventListener("missed", (e) => {
        const data = JSON.parse(e.data);
        status.textContent = "listening — we'll shout when you miss one";
        status.className = "";
        renderMissed(data);
      });

      // the push: a departure just slipped past the grace window
      source.addEventListener("just_missed", (e) => {
        const j = JSON.parse(e.data);
        status.textContent = `you just missed the [${j.route}] at ${j.departure}!`;
        status.className = "error";
        window.alert(`you just missed the [${j.route}] at ${j.departure} — excuse: ${j.excuse}`);

        // second request: repaint the last-3 board with fresh data
        fetch("/api/trips?" + new URLSearchParams({
          from: start_in.value,
          to: end_in.value
        }))
          .then(r => r.json())
          .then(data => { if (data.missed_journeys) renderMissed(data); })
          .catch(() => { /* board will catch up on the next missed event */ });
      });
    }

    function renderMissed(data) {
      const dep_list = document.getElementById("departures");
      dep_list.innerHTML = "";

      const board = data.snapped || {};
      if (board.from) {
        const li = document.createElement("li");
        li.className = "snap";
        li.textContent = `[snap] "${board.from.query}" -> ${board.from.snapped_to.name}` +
          ` ${board.from.distance_m}m away`;
        dep_list.appendChild(li);
      }
      if (board.to) {
        const li = document.createElement("li");
        li.className = "snap";
        li.textContent = `[snap] "${board.to.query}" -> ${board.to.snapped_to.name}` +
          ` ${board.to.distance_m}m away`;
        dep_list.appendChild(li);
      }

      const journeys = data.missed_journeys || [];
      if (journeys.length === 0) {
        const li = document.createElement("li");
        li.textContent = "you've missed nothing yet (or it's unreachable). congrats?";
        dep_list.appendChild(li);
      }
      for (const j of journeys) {
        const li = document.createElement("li");
        li.textContent = `[${j.route}] ${j.departure} -> ${j.arrival}` +
          ` | missed by ${j.missed_by_minutes}min` +
          ` | ${j.legs.length} leg${j.legs.length > 1 ? "s" : ""} | ${j.excuse}`;
        dep_list.appendChild(li);
      }
    }

    function autocomplete(input) {
      clearTimeout(input._timer);
      input._timer = setTimeout(async () => {
        const q = input.value;
        const list = document.getElementById("stop-names");
        if (!q || q.length < 2) return;
        try {
          const res = await fetch("/stops?q=" + encodeURIComponent(q));
          const body = await res.json();
          list.innerHTML = "";
          for (const s of body.results || []) {
            const opt = document.createElement("option");
            opt.value = s.name;
            opt.label = s.code || s.stop_id;
            list.appendChild(opt);
          }
        } catch (err) { /* autocomplete is best-effort */ }
      }, 250);
    }
  </script>

  <link rel="stylesheet" href="/styles.css"></link>
</head>

<body>
  <h1>dangit, you just missed it</h1>

  <label for="start">from</label>
  <input id="start" type="text" list="stop-names" placeholder="home, Hurdman, 455 Laurier...">
  <label for="end">to</label>
  <input id="end" type="text" list="stop-names" placeholder="work, Bayshore, ...">
  <datalist id="stop-names"></datalist>
  <button onclick="load()">Go!</button>

  <p id="status">type two places, then Go!</p>

  <div class="board-title">routes to catch (next trip)</div>
  <ul id="routes"></ul>

  <div class="board-title">last 3 you just missed</div>
  <ul id="departures"></ul>

</body>
