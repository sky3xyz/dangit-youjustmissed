name: deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rsync code
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude '.git/' --exclude '.github/' --exclude 'data/' --exclude '.env' --exclude '.venv/' --exclude 'node_modules/' --exclude '__pycache__/' --exclude 'tests/' --exclude '.zed/'
          path: .
          remote_path: /home/deployer/app/
          remote_host: ${{ secrets.VM_HOST }}
          remote_user: deployer
          remote_key: ${{ secrets.VM_SSH_KEY }}

      - name: Sync deps + restart + verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: deployer
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/app
            uv sync
            sudo systemctl restart missed-trips
            for i in $(seq 1 30); do
              curl -sf localhost:8080/healthz | grep -q '"ok"' && break
              sleep 5
            done
            systemctl is-active missed-trips
            curl -sf localhost:8080/healthz
